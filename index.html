label{font-size:12px;color:var(--g)}

canvas.pv.v{width:min(100%,340px)}canvas.pv.h{width:100%}.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1}
video{width:100%;max-width:100%;border-radius:10px;margin-top:10px}

<h1>ARENA <span>PULSE</span> Studio</h1>
<p class="s">Posts and news videos for TikTok, Facebook and YouTube.</p>

<section id="sp">
<h2>POST TEMPLATE</h2>
<select id="t"></select>
<div id="f"></div>
<button id="b">Make image</button>
<canvas id="c" hidden></canvas>
<img id="o" alt="" hidden>
<video id="v" hidden></video>
<button id="sv" hidden>Save</button>
<p class="n" id="n"></p>
</section>
<section id="sv2" hidden>
<div class="vg"><div class="vl">
<h2>1. FORMAT</h2>
<div class="pl" id="vpl"></div>
<h2>2. NEWS SLIDES</h2>
<div id="vsl"></div>
<button class="g big" id="vadd">+ Add slide</button>
<h2>3. INTRO, CLOSER AND LABEL</h2>
<label><input type="checkbox" id="vin" checked style="width:auto;margin-right:8px">Logo intro at the start</label><br>
<label><input type="checkbox" id="vout" checked style="width:auto;margin-right:8px">Closer at the end</label>
<label style="margin-top:8px">CLOSER WORD (FOLLOW, SUBSCRIBE...)</label>
<input type="text" id="vcl" style="width:100%;box-sizing:border-box;background:var(--s);color:var(--w);border:1px solid #3a3b42;border-radius:8px;padding:10px;font:inherit;font-size:15px;margin:4px 0 10px">
<label>RED TAG ABOVE THE TEXT (instead of PULSE NEWS)</label>
<input type="text" id="vtag" style="width:100%;box-sizing:border-box;background:var(--s);color:var(--w);border:1px solid #3a3b42;border-radius:8px;padding:10px;font:inherit;font-size:15px;margin:4px 0 8px">
<h2>4. TICKER (BOTTOM)</h2>
<label>TICKER WORD (instead of NEWS)</label>
<input type="text" id="vlab" style="width:100%;box-sizing:border-box;background:var(--s);color:var(--w);border:1px solid #3a3b42;border-radius:8px;padding:10px;font:inherit;font-size:15px;margin:4px 0 10px">
<label>TICKER CONTENT (one line per item)</label>
<textarea id="vtk" rows="4"></textarea>
</div><div class="vr">
<h2>PREVIEW</h2>
<canvas id="vc" class="pv v"></canvas>
<input type="range" id="vsk" min="0" max="1000" value="0">
<label style="margin-top:8px"><input type="checkbox" id="vsnd" checked style="width:auto;margin-right:8px">Sound effects</label>
<div class="bt"><button id="vpp" class="g">Play preview</button></div>
<h2>GENERATE</h2>
<button class="big" id="vgen">Generate video</button>
<p class="n" id="vn"></p>
<video id="vv" controls playsinline hidden></video>
<button class="big" id="vsv" hidden>Save video</button>
</div></div>
</section>
